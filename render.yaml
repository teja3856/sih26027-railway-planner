services:
  # Python AI Optimization Service
  - type: web
    name: sih-ai-optimizer
    env: python
    rootDir: ai_service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true

  # Node.js Backend API
  - type: web
    name: sih-backend-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://ai-resume-68ff7.web.app
      - key: DATABASE_URL
        fromDatabase:
          name: sih-railway-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_AI_URL
        value: https://sih-ai-optimizer.onrender.com

databases:
  # Managed PostgreSQL Database
  - name: sih-railway-db
    plan: free
    databaseName: sih_railway_db
    postgresMajorVersion: "16"
